# Baseline CI (same shape as REACH): every validation job is blocking; each publishes a compact always-on summary artifact.
# Tag contract: vYYYY.MM.NNNNNN[-fail], written by the tag stage on the tested commit.
# GitLab requirement: allow CI_JOB_TOKEN to push to this same repository.
# GitHub publication: after a green default-branch pipeline, "Publish GitHub" pushes the exact tested commit and its green tag using
# host-local private credentials (TAIGA_PRIVATE_PATH, a checkout of taiga-private); nothing secret is tracked here.
image: node:24-bookworm

stages:
  - validate
  - tag
  - release
  - publish

default:
  tags:
    - scope
  # The npm download cache is keyed by the lockfile: every job reuses it instead of downloading the dependencies again.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

.branch-push-only:
  rules:
    # Result tags are pushed by the tag stage: a tag pipeline never runs validation or tagging again.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

.validation-summary:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary/

"Public Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Public Release Check" npm run check:public-surface

"Lint":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Lint" npm run lint

"Type Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Type Check" npm run typecheck

# The suite is split in three named groups so the jobs run in parallel instead of one ~2 minute job.
.tests:
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate

"Tests: Workflow":
  extends: .tests
  script:
    - npm run build
    - 'node scripts/ci-gate.ts "Tests: Workflow" node scripts/run-tests.ts workflow'

"Tests: Tools":
  extends: .tests
  script:
    - npm run build
    - 'node scripts/ci-gate.ts "Tests: Tools" node scripts/run-tests.ts tools'

"Tests: Core":
  extends: .tests
  script:
    - npm run build
    - 'node scripts/ci-gate.ts "Tests: Core" node scripts/run-tests.ts core'

# Needs the masked CI variable DATABASE_URL (a PostgreSQL server the runner can reach); each test file creates and drops its own taiga_test_ database.
"Tests: Policy DB":
  extends: .tests
  script:
    - 'node scripts/ci-gate.ts "Tests: Policy DB" node scripts/run-tests.ts db'

"Package Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Package Check" npm run check:package

"Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Release Check" npm run check:release

.ci-tag:
  stage: tag
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    # The server certificate may be internal: git trusts only what the runner hands it (verification is never turned off).
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

"Build Release":
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - "Public Release Check"
    - "Lint"
    - "Type Check"
    - "Tests: Workflow"
    - "Tests: Tools"
    - "Tests: Core"
    - "Tests: Policy DB"
    - "Package Check"
    - "Release Check"
  script:
    # The release identity is the version the green tag job gives this very pipeline (same grammar as .ci-tag).
    - VERSION="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"
    - npm run build
    - node scripts/release.ts build --build-id "$VERSION" --repository-commit "$CI_COMMIT_SHA" --out release
    - node scripts/release.ts verify --out release
  artifacts:
    expire_in: 14 days
    paths:
      - release/

# Publication of the exact tested commit and its green tag: default-branch push only, never a tag pipeline.
# Credentials live only under the host-local private root (a checkout of taiga-private on the publishing host).
"Publish GitHub":
  stage: publish
  tags:
    - docker-prod
  variables:
    GIT_DEPTH: "0"
  before_script: []
  interruptible: false
  needs:
    - "ci-tag-green"
    - job: "Build Release"
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - export TAIGA_PRIVATE_PATH="${TAIGA_PUBLICATION_PATH:-$HOME/taiga-prod/taiga-private}"
    - node scripts/git-ci/publish-github.ts
