# Baseline CI (same shape as REACH): every validation job is blocking; each publishes a compact always-on summary artifact.
# Tag contract: vYYYY.MM.NNNNNN[-fail], written by the tag stage on the tested commit.
# GitLab requirement: allow CI_JOB_TOKEN to push to this same repository.
# GitHub publication: after a green default-branch pipeline, "Publish GitHub" pushes the exact tested commit and its green tag using
# host-local private credentials (TAIGA_PRIVATE_PATH, a checkout of taiga-private); nothing secret is tracked here.
image: node:24-bookworm

stages:
  - validate
  - tag
  - release
  - publish

default:
  tags:
    - scope
  # The pnpm store is keyed by the lockfile: every job reuses it instead of downloading the dependencies again.
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push
  before_script:
    - npm install -g pnpm@10.34.0 --no-audit --no-fund
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

.branch-push-only:
  rules:
    # Result tags are pushed by the tag stage: a tag pipeline never runs validation or tagging again.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

.validation-summary:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary/

"Public Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Public Release Check" pnpm run check:public-surface

"Type Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Type Check" pnpm run typecheck

# The suite is split in three shards so the jobs run in parallel instead of one ~2 minute job.
.tests:
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate

"Tests: Shard 1":
  extends: .tests
  script:
    - 'node scripts/ci-gate.ts "Tests: Shard 1" node --test --test-timeout=120000 --test-shard=1/3 "test/*.test.ts"'

"Tests: Shard 2":
  extends: .tests
  script:
    - 'node scripts/ci-gate.ts "Tests: Shard 2" node --test --test-timeout=120000 --test-shard=2/3 "test/*.test.ts"'

"Tests: Shard 3":
  extends: .tests
  script:
    - 'node scripts/ci-gate.ts "Tests: Shard 3" node --test --test-timeout=120000 --test-shard=3/3 "test/*.test.ts"'

"Package Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Package Check" pnpm run check:package

"Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/ci-gate.ts "Release Check" pnpm run check:release

.ci-tag:
  stage: tag
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    # The server certificate may be internal: git trusts only what the runner hands it (verification is never turned off).
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

"Build Release":
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - "Public Release Check"
    - "Type Check"
    - "Tests: Shard 1"
    - "Tests: Shard 2"
    - "Tests: Shard 3"
    - "Package Check"
    - "Release Check"
  script:
    # The release identity is the version the green tag job gives this very pipeline (same grammar as .ci-tag).
    - VERSION="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"
    - pnpm run build
    - node scripts/release.ts build --build-id "$VERSION" --repository-commit "$CI_COMMIT_SHA" --out release
    - node scripts/release.ts verify --out release
  artifacts:
    expire_in: 14 days
    paths:
      - release/

# Publication of the exact tested commit and its green tag: default-branch push only, never a tag pipeline.
# Credentials live only under the host-local private root (a checkout of taiga-private on the publishing host).
"Publish GitHub":
  stage: publish
  tags:
    - docker-prod
  variables:
    GIT_DEPTH: "0"
  before_script: []
  interruptible: false
  needs:
    - "ci-tag-green"
    - job: "Build Release"
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - export TAIGA_PRIVATE_PATH="${TAIGA_PUBLICATION_PATH:-$HOME/taiga-prod/taiga-private}"
    - node scripts/git-ci/publish-github.ts
