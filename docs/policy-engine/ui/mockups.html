<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAIGA MCP · Policy console mockups</title><style>
:root{color-scheme:dark;--bg:#0b1420;--panel:#111f2d;--line:#263a49;--muted:#93a8b9;--text:#e5edf3;--accent:#32bfa3;--green:#64d6ac;--amber:#e8b86b;--red:#ef8690}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#163a43 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,a,summary{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.side{background:#0b1623dc;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:12px;align-items:center;padding:5px 8px}.brand b{font-size:22px;line-height:1.05;letter-spacing:1px}.brand small{display:block;color:var(--accent);font-size:13px;letter-spacing:3px;margin-top:5px}.nav a{display:flex;gap:12px;align-items:center;padding:12px;border-radius:7px;color:var(--muted);margin:5px 0}.nav a.active{background:#143c3b;color:#b6f5e6;border-left:3px solid var(--accent);padding-left:9px}.nav a:hover{background:#17313d}.foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px;color:var(--muted);font-size:12px}.main{padding:0 30px 25px;min-width:0}.header{height:87px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:20px}.header h1{font-size:26px;margin:0}.header p{margin:3px 0;color:var(--muted);font-size:13px}.operator{display:flex;align-items:center;gap:12px;white-space:nowrap}.pill{display:inline-flex;align-items:center;border:1px solid #31534f;background:#163630;color:#9ce2ce;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}.pill.warn{color:var(--amber);background:#302b21;border-color:#594c30}.pill.neutral{color:var(--muted);background:#192735;border-color:var(--line)}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.spacer{flex:1}.btn,select,input{border:1px solid var(--line);background:#132333;padding:8px 12px;border-radius:6px}.btn.primary{background:#197f6c;border-color:#259b85;color:white;font-weight:650}.btn:hover{border-color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.card{background:#111f2de8;border:1px solid var(--line);border-radius:10px;padding:17px;min-width:0}.card h2{font-size:16px;margin:0 0 4px}.stat{font-size:32px;font-weight:700;margin:7px 0 0}.rowgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin:16px 0}.section{margin:16px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-weight:600;background:#142433;position:sticky;top:0}td,th{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}td small{display:block;color:var(--muted);font-size:11px}.right{text-align:right}.center{text-align:center}.link{color:#76ddc7;font-weight:600}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 17px;overflow:auto}.tabs a{padding:10px 1px;color:var(--muted);white-space:nowrap}.tabs .on{color:var(--accent);border-bottom:2px solid var(--accent)}.notice{border:1px solid #32574f;background:#122d2d;border-radius:7px;padding:12px 14px;display:flex;gap:10px;align-items:center}.notice.warning{border-color:#5b4e32;background:#29251d;color:#f0d4a0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--accent)}details{border:1px solid var(--line);border-radius:7px;background:#101e2b;margin:9px 0;overflow:hidden}summary{padding:12px 14px;display:flex;align-items:center;gap:9px;font-weight:650;list-style:none}summary:before{content:'›';color:var(--muted);font-size:21px;line-height:1}details[open]>summary:before{transform:rotate(90deg)}details[open]>summary{border-bottom:1px solid var(--line)}.inner{padding:0 12px 12px}.nested{margin:10px 0}.nested summary{font-size:13px;padding:10px}.allow{color:var(--green);font-weight:650}.deny{color:#8395a5}.locked{color:var(--amber)}.cell{border:1px solid transparent;background:none;padding:5px 7px;border-radius:5px;font-size:13px}.cell:hover{border-color:var(--accent)}.changed{background:#203b38;color:#b9f2df;border-left:2px solid var(--accent)}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.diff>div{padding:12px;border:1px solid var(--line);border-radius:7px;background:#142230}.before{color:#f0acac}.after{color:#83dec0}.listrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.listrow:last-child{border-bottom:0}.label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field{margin:12px 0}.field input{width:100%}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;margin-top:12px;border-top:1px solid var(--line)}.screen{display:none}.screen.active{display:block}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;margin:12px 0;flex-wrap:wrap}.empty{padding:10px;color:var(--muted)}.mono{font:12px ui-monospace,monospace;color:#b6d3db}.mock{color:#a6b7c5;font-size:11px;text-transform:uppercase;letter-spacing:1px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formrow select{width:100%}@media(max-width:900px){.shell{grid-template-columns:180px 1fr}.main{padding:0 15px}.cards{grid-template-columns:repeat(2,1fr)}.rowgrid{grid-template-columns:1fr}.brand b{font-size:18px}}
</style><body><div class="shell"><aside class="side"><div class="brand"><svg width="43" height="43" viewBox="0 0 48 48" aria-label="Proposed logo"><path d="M24 3 43 13v22L24 45 5 35V13Z" fill="#163e3d" stroke="#32bfa3" stroke-width="2"/><path d="M15 16 33 16 24 33 15 16M24 16V33" stroke="#8bf0d4" stroke-width="2" fill="none"/><g fill="#8bf0d4"><circle cx="15" cy="16" r="3"/><circle cx="33" cy="16" r="3"/><circle cx="24" cy="33" r="3"/></g></svg><b>TAIGA<small>MCP</small></b></div><nav class="nav" id="nav"></nav><div class="foot"><span class="dot"></span>Design preview<br>Illustrative data · not connected<br><br>Policy console · MVP</div></aside><main class="main"><header class="header"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="operator"><span class="pill neutral">PROTOTYPE</span><span>◉ &nbsp; PO</span></div></header><div id="root"></div></main></div><script>
const nav=[['overview','◈','Overview','System overview','Policy engine status and project readiness'],['projects','▤','Projects','Projects','UUIDv7 project inventory and active policy'],['ownership','◉','Ownership','Project policy · Ownership','RAG MCP / Revision 1 · Default policy'],['transitions','⇄','Transitions','Project policy · Transitions','RAG MCP / Revision 1 · Default policy'],['operations','☷','Operations','Project policy · Operations','RAG MCP / Revision 1 · Default policy'],['proposals','◇','Proposals','Review proposal','RAG MCP / Proposed revision 2'],['history','◷','History','Policy history','RAG MCP / Immutable revisions and audit'],['system','⚙','System / API','System & API','Runtime, database, reconciliation and endpoints']];
const badge=(s,k='')=>`<span class="pill ${k}">${s}</span>`;const card=(title,body,sub='')=>`<section class="card"><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}${body}</section>`;const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const btn=(label,cls='',action='')=>`<button class="btn ${cls}" ${action?`onclick="${action}"`:''}>${label}</button>`;const link=(s,p)=>`<a class="link" href="#${p}">${s} ↗</a>`;const projectbar=()=>`<div class="toolbar"><span class="sub">Projects /</span><select aria-label="Project"><option>RAG MCP</option><option>REACH MCP</option></select>${badge('Active · v1')}<span class="spacer"></span>${btn('Review draft','',"location.hash='proposals'")}</div><div class="tabs">${['ownership','transitions','operations','proposals','history'].map(x=>`<a href="#${x}" class="${page===x?'on':''}">${x[0].toUpperCase()+x.slice(1)}</a>`).join('')}</div>`;let page='overview';const colors=['#8b9dc3','#f5a623','#2d9cdb','#8e6ccf','#d0021b','#27ae60','#95a5a6'];const states=['To Do','In Progress','Request','GPT Validation','Human Decision','Done','Cancelled'];const state=(s)=>`<span class="dot" style="background:${colors[states.indexOf(s)]||'#8097a8'}"></span>${s}`;const yes='<span class="allow">✓ Allow</span>',no='<span class="deny">— Deny</span>',override='<span class="locked">◇ Override</span>',lock='<span class="locked">🔒 Locked</span>';const owners=['GPT','Claude Code','GPT','GPT','PO','—','—'];const stat=(a,b,c)=>`<div class="card"><div class="sub">${a}</div><div class="stat">${b}</div><div class="sub">${c}</div></div>`;
const projectRows=[['RAG MCP','rag-mcp',badge('Ready'), 'v1 · Default','Illustrative',link('Configure','ownership')],['REACH MCP','reach-mcp',badge('Ready'),'v1 · Default','Illustrative',link('Configure','ownership')],['POLICY LAB','taiga-policy-lab',badge('Pending','warn'),'—','Illustrative',link('Inspect','system')]];
const views={overview:()=>`<div class="cards">${stat('Managed projects','2','Illustrative · UUIDv7')}${stat('Pending mirror','1','Requires review')}${stat('Policy proposals','1','Awaiting PO')}${stat('Runtime status','Ready','Example status')}</div><div class="notice"><span>◈</span><div><b>Governance is project-scoped.</b> <span class="sub">Changes to one project do not modify another.</span></div></div><div class="rowgrid">${card('Project inventory',table(['Project','UUIDv7','Policy','Action'],projectRows.map(r=>[r[0],r[2],r[3],r[5]])),'Active policies and synchronization state')}${card('Review queue',`<div class="listrow"><div><b>RAG MCP · GPT execution</b><div class="sub">Revision 2 · 4 illustrative changes</div></div><span class="spacer"></span>${badge('Pending','warn')}</div><div class="listrow">${link('Open proposal','proposals')}</div><div class="listrow"><div><b>POLICY LAB</b><div class="sub">Mirror verification required</div></div></div>`,'Human approval is required')}</div>${card('Runtime dependencies',table(['Component','State','Detail'],[['PostgreSQL',badge('Ready'),'Dedicated policy store'],['Taiga API',badge('Reachable'),'Operational source of truth'],['MCP transport',badge('Ready'),'Admin listener is private'],['Bridge',badge('Configured','neutral'),'Recipient derived from policy']]),'All status values are examples for the mockup.')}`,
projects:()=>`<div class="toolbar"><input placeholder="Search projects…" aria-label="Search projects"><select><option>All lifecycle states</option><option>Managed</option><option>Pending</option><option>Drift</option></select><span class="spacer"></span>${btn('Reconcile preview')}</div>${card('Project inventory',table(['Project','Slug','UUIDv7','Active policy','Last sync','Action'],projectRows),'Projects are discovered from Taiga; policies are stored in PostgreSQL.') }<div class="notice"><b>Mirror safety</b><span class="sub">Reconciliation never overwrites an active policy or regenerates existing UUIDs.</span></div>`,
ownership:()=>projectbar()+`<div class="notice"><b>Ownership ≠ permission.</b><span class="sub">An owner is accountable for a state. Transition rights are configured separately.</span></div><details open><summary>Task <span class="sub">7 states</span></summary><div class="inner">${table(['State','Accountable owner','Other allowed roles','Policy source'],states.map((s,i)=>[state(s),`<select aria-label="Owner of ${s}">${[owners[i],...['GPT','Claude Code','PO','—'].filter(x=>x!==owners[i])].map(x=>`<option>${x}</option>`).join('')}</select>`,i===1?'See transitions': 'See operations',i===4?lock:'Default v1']))}</div></details>${['Epic','User Story','Issue','Sprint'].map(x=>`<details><summary>${x}<span class="sub">Expand configuration</span></summary><div class="empty">Owners and lifecycle rules resolved from the project catalog.</div></details>`).join('')}<div class="bottom"><span class="sub">Changes are drafts until approved.</span>${btn('Review proposal','primary',"location.hash='proposals'")}</div>`,
transitions:()=>projectbar()+`<div class="toolbar"><select><option>All roles</option><option>GPT</option><option>Claude Code</option><option>PO</option></select><select><option>All decisions</option><option>Allow</option><option>Deny</option><option>Conditional</option></select><label class="sub"><input type="checkbox"> Changed only</label><span class="spacer"></span>${btn('Simulate')}</div><div class="legend">${yes} ${no} ${override} ${lock}<span>Click a decision to inspect the rule.</span></div><details><summary>Epic <span class="sub">Expand all pairs</span></summary><div class="empty">Epic transition catalog.</div></details><details><summary>User Story <span class="sub">Expand all pairs</span></summary><div class="empty">Story transition catalog.</div></details><details open><summary>Task <span class="sub">7 states · 49 pairs</span></summary><div class="inner"><details class="nested"><summary>${state('To Do')} <span class="sub">7 destinations</span></summary><div class="empty">Select an origin to review all destinations.</div></details><details class="nested" open><summary>${state('In Progress')} <span class="sub">7 destinations</span></summary>${table(['Destination','GPT','Claude Code','PO','Artifact / rule'],[[state('To Do'),yes,yes,override,'blocker_report'],[state('In Progress'),no,no,no,'No transition'],[state('Request'),no,yes,override,'workflow_request'],[state('GPT Validation'),`<button class="cell deny" onclick="toggleCell(this)">— Deny</button>`,yes,override,'execution_handoff'],[state('Human Decision'),no,yes,override,'human_decision_request'],[state('Done'),lock,lock,override,'Normal validation required'],[state('Cancelled'),yes,no,yes,'po_decision']])}</details><details class="nested"><summary>${state('Request')} <span class="sub">7 destinations</span></summary><div class="empty">Request exit rules.</div></details></div></details>${['Issue','Sprint'].map(x=>`<details><summary>${x}<span class="sub">Expand all pairs</span></summary><div class="empty">Lifecycle rules.</div></details>`).join('')}<div class="bottom"><span class="sub">Prototype: the actual catalog is generated by the backend.</span>${btn('Review proposal','primary',"location.hash='proposals'")}</div>`,
operations:()=>projectbar()+`<div class="toolbar"><input placeholder="Search operation…" aria-label="Search operations"><select><option>All action types</option><option>Read</option><option>Write</option><option>Admin</option></select><span class="spacer"></span>${btn('Simulate')}</div><div class="notice"><b>Separate action permissions.</b><span class="sub">Create, edit, delete, reorder and status changes are independently authorized.</span></div><details open><summary>Epic <span class="sub">Sample operation catalog</span></summary><div class="inner">${table(['Operation','GPT','Claude Code','PO','Constraint'],[['Read / list',yes,yes,yes,'Project scope'],['Create',yes,yes,yes,'Description contract'],['Update fields',yes,yes,yes,'Field restrictions'],['Delete',yes,yes,yes,'Legacy parity · review'],['Change status',link('Matrix','transitions'),link('Matrix','transitions'),link('Matrix','transitions'),'Origin × destination'],['Link User Story',yes,yes,yes,'Same project'],['Bulk create',yes,yes,yes,'Resolve all resources']])}</div></details>${['User Story','Task','Issue','Sprint','Project / UUID','Roles / Memberships','Wiki / Webhooks'].map(x=>`<details><summary>${x}<span class="sub">Expand operations</span></summary><div class="empty">Operations are supplied by the backend catalog.</div></details>`).join('')}<div class="bottom"><span class="sub">Illustrative baseline permissions; not a verified authorization result.</span>${btn('Review proposal','primary',"location.hash='proposals'")}</div>`,
proposals:()=>`<div class="toolbar">${badge('Awaiting PO','warn')}<span class="sub">Proposed by GPT · Base v1 · Candidate v2</span><span class="spacer"></span>${link('Back to project','transitions')}</div><div class="notice warning"><b>Nothing is active yet.</b> Review the entire change set before activating.</div><div class="rowgrid">${card('Semantic changes',table(['Rule','Before · v1','After · v2'],[['Task / In Progress owner','Claude Code','<span class="after">GPT</span>'],['Execution handoff actor','Claude Code','<span class="after">GPT</span>'],['Request route','Claude → GPT','<span class="after">Denied (self-request)</span>'],['Completion recipient','Claude Code','<span class="after">GPT</span>']]),'Candidate: GPT execution without Claude dispatch')}${card('Impact preview',`<div class="listrow"><span class="allow">✓</span><div><b>RAG MCP only</b><div class="sub">No other project changes</div></div></div><div class="listrow"><span class="allow">✓</span><div><b>Human Decision stays PO</b><div class="sub">Mandatory invariant</div></div></div><div class="listrow"><span class="locked">◇</span><div><b>Self-validation</b><div class="sub">Same actor; distinct execution and validation phases</div></div></div><div class="listrow"><span class="locked">◇</span><div><b>Activation preconditions</b><div class="sub">Actual runtime checks required</div></div></div>`,'Illustrative simulation, not live validation')}</div>${card('Decision',`<div class="field"><label class="label" for="reason">Approval reason (required)</label><input id="reason" placeholder="Explain why this change is approved"></div><div class="bottom"><span class="sub">Activation is atomic and audited. No restart needed.</span><div>${btn('Reject')}&nbsp;${btn('Approve & activate','primary',"previewApprove()")}</div></div><div id="approval-status" class="sub" role="status"></div>`,'PO only · expected active revision v1')}`,
history:()=>projectbar()+`<div class="toolbar"><select><option>All revisions</option><option>v1</option><option>v2</option></select><span class="spacer"></span>${btn('Export policy JSON')}</div>${card('Policy versions',table(['Revision','State','Author','Reason','Action'],[['v2',badge('Proposed','warn'),'GPT','GPT execution mode',link('Review','proposals')],['v1',badge('Active'),'Bootstrap','Legacy default parity','<span class="sub">Compare</span>']]),'Immutable versions; rollback creates a new activation.') }<div class="section">${card('Audit activity',table(['Time','Actor','Operation','Policy','Result'],[['Example 13:04','GPT','policy.propose','v1',badge('Recorded')],['Example 13:02','System','mirror.reconcile','v1',badge('Verified')],['Example 13:00','System','policy.bootstrap','v1',badge('Activated')]]),'Examples only. Production results must come from the audit API.')}</div>`,
system:()=>`<div class="cards">${stat('Policy DB','Ready','Example')}${stat('Taiga API','Ready','Example')}${stat('Schema','v1','Example')}${stat('Mirror','Pending','1 illustrative project')}</div><div class="rowgrid">${card('Reconciliation',`<p class="sub">Preview changes before applying. Existing policies and UUIDs are preserved.</p>${btn('Dry run')}&nbsp;${btn('Apply verified changes')}`)}${card('Runtime configuration',table(['Parameter','Value'],[['Admin listener','Private'],['MCP transport','Existing'],['Database','PostgreSQL'],['Deployment','Docker / host TBD']]))}</div>${card('API catalog',table(['Method','Endpoint','Purpose'],[['GET','/admin/api/v1/projects','Project inventory'],['GET','/admin/api/v1/catalog','Operation catalog'],['POST','/admin/api/v1/projects/{id}/simulate','Policy simulation'],['POST','/admin/api/v1/projects/{id}/proposals','Propose policy'],['POST','/admin/api/v1/projects/{id}/proposals/{id}/approve','PO approval']]),'Proposed contract; endpoints are not running in this mockup.')}`};
function toggleCell(el){const on=el.textContent.includes('Deny');el.textContent=on?'✓ Allow · draft':'— Deny';el.className='cell '+(on?'changed':'deny')};function previewApprove(){document.getElementById('approval-status').textContent=document.getElementById('reason').value.trim()?'Preview only: no real approval was sent.':'Enter an approval reason.'}function render(){page=location.hash.slice(1)||'overview';if(!views[page])page='overview';const n=nav.find(x=>x[0]===page);document.getElementById('title').textContent=n[3];document.getElementById('subtitle').textContent=n[4];document.getElementById('nav').innerHTML=nav.map(x=>`<a href="#${x[0]}" class="${x[0]===page?'active':''}"><span>${x[1]}</span>${x[2]}</a>`).join('');document.getElementById('root').innerHTML=views[page]();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();</script></body></html>
